name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Angular application
        run: npm run build
      - name: Verify Pages artifact
        shell: bash
        run: |
          test -f dist/portfolio/browser/index.html
          test -f dist/portfolio/browser/css/style.css
          test -f dist/portfolio/browser/css/responsive.css
          test -f dist/portfolio/browser/main-*.js
          grep -q 'href="css/style.css"' dist/portfolio/browser/index.html
          grep -q 'href="css/responsive.css"' dist/portfolio/browser/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/portfolio/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
